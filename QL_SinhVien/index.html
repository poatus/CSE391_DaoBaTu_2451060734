<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="trang-chu">
        <div class="tieu-de">
            <h1>🎓 QUẢN LÝ SINH VIÊN</h1>
        </div>

        <div class="thong-ke">
            <div class="o-thong-ke">
                <h3>Tổng số sinh viên</h3>
                <p id="tongSoSinhVien">0</p>
            </div>
            <div class="o-thong-ke">
                <h3>Điểm trung bình</h3>
                <p id="diemTrungBinh">0.00</p>
            </div>
        </div>

        <div class="nut-them">
            <button id="nutThemSinhVien" class="nut nut-xanh">➕ Thêm Sinh Viên</button>
        </div>

        <div id="thongBao"></div>

        <div class="bang-sinh-vien">
            <table>
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Mã SV</th>
                        <th>Họ Tên</th>
                        <th>Ngày Sinh</th>
                        <th>Lớp</th>
                        <th>Điểm TB</th>
                        <th>Email</th>
                        <th>Thao Tác</th>
                    </tr>
                </thead>
                <tbody id="danhSachSinhVien">
                </tbody>
            </table>
        </div>

        <div id="hopThoai" class="hop-thoai">
            <div class="noi-dung-hop-thoai">
                <div class="dau-hop-thoai">
                    <h2 id="tieuDeHopThoai">Thêm Sinh Viên</h2>
                    <span class="nut-dong" id="nutDong">&times;</span>
                </div>
                <form id="formSinhVien">
                    <div class="o-nhap">
                        <label>Mã sinh viên *</label>
                        <input type="text" id="maSV" required>
                    </div>
                    <div class="o-nhap">
                        <label>Họ và tên *</label>
                        <input type="text" id="hoTen" required>
                    </div>
                    <div class="o-nhap">
                        <label>Ngày sinh *</label>
                        <input type="date" id="ngaySinh" required>
                    </div>
                    <div class="o-nhap">
                        <label>Lớp *</label>
                        <input type="text" id="lop" required>
                    </div>
                    <div class="o-nhap">
                        <label>Điểm trung bình *</label>
                        <input type="number" id="diem" min="0" max="10" step="0.01" required>
                    </div>
                    <div class="o-nhap">
                        <label>Email *</label>
                        <input type="email" id="email" required>
                    </div>
                    <input type="hidden" id="viTriSua" value="-1">
                    <div class="nhom-nut">
                        <button type="submit" class="nut nut-xanh">💾 Lưu</button>
                        <button type="button" class="nut nut-xam" id="nutHuy">❌ Hủy</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
