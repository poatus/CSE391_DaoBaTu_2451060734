<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📝 Đăng Ký Tài Khoản</h1>
            <p>Real-time form validation with JavaScript</p>
        </header>

        <form id="registerForm" novalidate>
            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Họ và Tên</label>
                <div class="input-wrapper">
                    <input type="text" id="fullName" placeholder="Nguyễn Văn A" autocomplete="name" required minlength="2" maxlength="50">
                    <span class="input-icon" id="nameIcon"></span>
                </div>
                <div class="error-message" id="nameError"></div>
                <div class="hint">Từ 2-50 ký tự</div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="example@email.com" autocomplete="email" required>
                    <span class="input-icon" id="emailIcon"></span>
                </div>
                <div class="error-message" id="emailError"></div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Mật Khẩu</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required minlength="8">
                    <span class="input-icon" id="passwordIcon"></span>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">👁️</button>
                </div>
                <div class="error-message" id="passwordError"></div>
                <div class="password-strength">
                    <div class="strength-bar" id="strengthBar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <span class="strength-text" id="strengthText">Nhập mật khẩu</span>
                </div>
                <div class="hint">Tối thiểu 8 ký tự, gồm chữ hoa, thường, số, ký tự đặc biệt</div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Xác Nhận Mật Khẩu</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                    <span class="input-icon" id="confirmIcon"></span>
                </div>
                <div class="error-message" id="confirmError"></div>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="phone">Số Điện Thoại</label>
                <div class="input-wrapper">
                    <input type="tel" id="phone" placeholder="0901-234-567" autocomplete="tel" required>
                    <span class="input-icon" id="phoneIcon"></span>
                </div>
                <div class="error-message" id="phoneError"></div>
                <div class="hint">10 chữ số, tự động thêm dấu gạch</div>
            </div>

            <!-- Submit -->
            <button type="submit" id="submitBtn" class="submit-btn" disabled>
                <span class="btn-text">Đăng Ký</span>
                <span class="btn-icon">→</span>
            </button>
        </form>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <h2 class="modal-title">Đăng Ký Thành Công!</h2>
            <div class="modal-body" id="modalBody"></div>
            <button class="modal-btn" id="modalBtn">OK</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
