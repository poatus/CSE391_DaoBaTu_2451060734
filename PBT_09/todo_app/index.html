<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📋 Todo App</h1>
            <p class="subtitle">Stay organized, get things done</p>
        </header>

        <form id="todoForm" class="todo-form">
            <div class="input-group">
                <input type="text" id="todoInput" placeholder="What needs to be done?" autocomplete="off" required>
                <button type="submit" class="btn-add">Add</button>
            </div>
        </form>

        <div class="todo-controls">
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <span class="items-left"><span id="itemsCount">0</span> items left</span>
        </div>

        <ul id="todoList" class="todo-list"></ul>

        <div class="todo-footer">
            <button id="clearCompleted" class="btn-clear">Clear Completed</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
